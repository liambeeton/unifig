# The modeline below is what gives an editor autocomplete and inline errors —
# the schema is the same one `unifig validate` checks against.
# yaml-language-server: $schema=https://raw.githubusercontent.com/liambeeton/unifig/main/schema/unifig.schema.json

networks:
  # The Controller's built-in LAN. Names are how unifig matches Resources, so
  # this must be the name as it appears in the Controller.
  - name: Default
    subnet: 192.168.1.1/24

  - name: IoT
    vlan: 20
    subnet: 10.20.0.1/24

wlans:
  # `network` must name a network above — that reference is checked offline by
  # `unifig validate`, before anything touches the Controller.
  - name: Home IoT
    network: IoT
    # Never the passphrase itself. unifig replaces ${ENV_VAR} references from
    # the environment as it loads the file, so this line is safe to commit and
    # the secret lives in your direnv .envrc instead. `unifig export` writes
    # exactly this form.
    passphrase: ${WIFI_IOT_PASSPHRASE}

zones:
  # A zone groups networks for the firewall. The Controller ships its own —
  # External, Internal, Gateway and so on — and you can name one here to manage
  # what is in it. unifig never creates or deletes a built-in zone, whatever
  # `--prune` is told.
  - name: Untrusted
    # Stating `networks` states the whole membership: a network you stop naming
    # here is one the next apply takes out of the zone. Omit the key to leave
    # the Controller's own membership alone.
    #
    # A network is in exactly one zone, and the Controller enforces that: naming
    # one here takes it out of whichever zone has it, and dropping one from this
    # list moves it to `Internal` rather than leaving it outside every zone. The
    # plan names both sides before it does either, and two zones in this file
    # may not name the same network.
    networks:
      - IoT

firewall-policies:
  # A policy governs the traffic between two zones. Both ends are matched by
  # name, and either may be a zone the Controller already has rather than one
  # this file defines — which is why `External` needs no entry above.
  - name: IoT to internet
    action: allow
    source: Untrusted
    destination: External

  - name: IoT off the LAN
    action: block
    source: Untrusted
    destination: Internal

port-forwards:
  # What the network answers to from the internet. Everything but `source` is
  # required: a forward that did not say which port, which host and which
  # protocol would not be a record of an exposed service.
  - name: Home Assistant
    port: 8443
    # An address, not the name of a network above — it is what the Controller
    # stores, so nothing checks it against the rest of this file.
    forward-ip: 10.20.0.10
    forward-port: 8123
    protocol: tcp
    # Omit `source` to leave the Controller's own choice alone. A forward unifig
    # creates without one accepts traffic from anywhere on the internet, and the
    # plan says so before it does.
    source: 203.0.113.0/24

dhcp-reservations:
  # A reservation pins one client to one address, and is keyed by MAC. It is the
  # one section here that is not an object on the Controller: your Controller
  # keeps a record for every client it has ever seen, and a reservation is the
  # fixed-address half of that record.
  - mac: "00:1a:2b:3c:4d:5e"
    # There is no network to name. The Controller works out which network an
    # address belongs to from the address itself, so this has to fall inside the
    # subnet of a network the Controller has — `IoT` above, here.
    ip: 10.20.0.50

  # Case does not matter: the Controller stores every MAC in lower case and
  # unifig matches the same way. Two entries differing only in case would be one
  # reservation written twice, which `unifig validate` reports.
  - mac: "00:1A:2B:3C:4D:5F"
    ip: 10.20.0.51

wan:
  # A WAN slot is a Setting, not a Resource: the router has the slots it has, so
  # unifig only ever updates one — it never creates, deletes or prunes a slot.
  # `slot` is the Controller's own name for the uplink, and how unifig matches
  # it, whatever you have renamed the connection to in the UI.
  - slot: WAN
    type: pppoe
    username: ${WAN_PPPOE_USERNAME}
    password: ${WAN_PPPOE_PASSWORD}

  # Naming a slot and nothing else means "this is mine to match, and I am not
  # managing anything about it" — the same as `- name:` on a network.
  - slot: WAN2

# Encrypted DNS is a Setting too, and a singleton: the Controller has exactly
# one, so this section is a mapping rather than a list. UniFi's UI calls it
# DNS Shield. Leave the section out entirely and unifig does not touch it.
encrypted-dns:
  state: custom

  # `servers` is one field, not a list of Resources: stating it makes this list
  # the Controller's list, so a resolver you stop naming here is one the next
  # apply removes — and the plan says so first. Omit the key to leave the
  # Controller's resolvers alone; write `servers: []` to say there are none.
  servers:
    - name: Quad9
      # A stamp for a private endpoint identifies the account it belongs to, so
      # it is a secret like a passphrase: keep it in the environment.
      stamp: ${DNS_QUAD9_STAMP}

