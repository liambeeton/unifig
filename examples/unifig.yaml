# The modeline below is what gives an editor autocomplete and inline errors —
# the schema is the same one `unifig validate` checks against.
# yaml-language-server: $schema=https://raw.githubusercontent.com/liambeeton/unifig/main/schema/unifig.schema.json

networks:
  # The Controller's built-in LAN. Names are how unifig matches Resources, so
  # this must be the name as it appears in the Controller.
  - name: Default
    subnet: 192.168.1.1/24

  - name: IoT
    vlan: 20
    subnet: 10.20.0.1/24

wlans:
  # `network` must name a network above — that reference is checked offline by
  # `unifig validate`, before anything touches the Controller.
  - name: Home IoT
    network: IoT
    # Never the passphrase itself. unifig replaces ${ENV_VAR} references from
    # the environment as it loads the file, so this line is safe to commit and
    # the secret lives in your direnv .envrc instead. `unifig export` writes
    # exactly this form.
    passphrase: ${WIFI_IOT_PASSPHRASE}

wan:
  # A WAN slot is a Setting, not a Resource: the router has the slots it has, so
  # unifig only ever updates one — it never creates, deletes or prunes a slot.
  # `slot` is the Controller's own name for the uplink, and how unifig matches
  # it, whatever you have renamed the connection to in the UI.
  - slot: WAN
    type: pppoe
    username: ${WAN_PPPOE_USERNAME}
    password: ${WAN_PPPOE_PASSWORD}

  # Naming a slot and nothing else means "this is mine to match, and I am not
  # managing anything about it" — the same as `- name:` on a network.
  - slot: WAN2

